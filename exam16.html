
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
</head>
<style>
    h1 { text-align: center; }
    .disp { width: 205px; height: 40px; margin-top: 3px; }
    .disp { font-family: "Oxanium", sans-serif; font-size: 22pt; text-align: right; }
    input[type=button] {
        width: 50px;
        height: 50px;
        text-align: center;
        vertical-align: middle;
        margin-top: 5px;
    }
    #calc { width: 220px; margin-left: auto; margin-right: auto; }
</style>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    $(document).ready(function(){

        $('.num').click(function(){
            let cur = $('#disp2').val();
            let n = $(this).val();
            $('#disp2').val(cur + n);
        });

        $('.op').click(function(){
            let cur = $('#disp2').val();
            let opt = $(this).val();

            if (opt != '=') {
                $('#disp2').val(cur + opt);
            }
            else {
                $('#disp1').val(cur);

                let operator;

                if (cur.includes('+')) {
                    operator = '+';
                } else if (cur.includes('-')) {
                    operator = '-';
                } else if (cur.includes('*')) {
                    operator = '*';
                } else if (cur.includes('/')) {
                    operator = '/';
                }

                if (!operator) return;

                let numbers = cur.split(operator);

                if (numbers.length != 2 ||
                    numbers[0] === '' ||
                    numbers[1] === '') {
                    $('#disp2').val('Error');
                    return;
                }

                let num1 = Number(numbers[0]);
                let num2 = Number(numbers[1]);

                if (!Number.isFinite(num1) ||
                    !Number.isFinite(num2)) {
                    $('#disp2').val('Error');
                    return;
                }

                let result;

                if (operator == '+') {
                    result = num1 + num2;
                } else if (operator == '-') {
                    result = num1 - num2;
                } else if (operator == '*') {
                    result = num1 * num2;
                } else if (operator == '/') {
                    if (num2 == 0) {
                        $('#disp2').val('Error');
                        return;
                    }
                    result = num1 / num2;
                }

                $('#disp2').val(result);
            }
        });

        // AC 버튼 클릭 시 초기화
        $('.func').click(function(){
            $('#disp1').val('');
            $('#disp2').val('');
        });

    });
</script>

<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>

        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>

        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>

        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>

        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>
</body>
</html>

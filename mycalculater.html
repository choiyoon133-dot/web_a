<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Calculator</title>

<style>
/* 제목과 버튼에 사용하는 폰트 */
@font-face {
    font-family: 'Hearty Beltime';
    src: url('./fonts/Hearty%20Beltime.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

/* 계산 과정과 결과 숫자에 사용하는 폰트 */
@font-face {
    font-family: 'Buffy';
    src: url('./fonts/Buffy-Light.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #fdefd9;
    font-family: 'Hearty Beltime', cursive;
}

.wrapper {
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
    padding-top: 15px;
}

/* 제목: 기존 디자인 유지 */
h1 {
    margin: 0 0 10px;
    font-family: 'Hearty Beltime', cursive;
    font-size: clamp(17px, 4.2vw, 31px);
    text-align: center;
    color: black;
    white-space: nowrap;
    position: relative;
    top: 55px;
    z-index: 3;
}

/* 하트와 계산기를 동일한 비율로 조정 */
.stage {
    position: relative;
    width: 100%;
    aspect-ratio: 750 / 650;
    container-type: inline-size;
}

/* 하트 배경 */
.heart {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
}

/* 계산기 위치 */
.calculator {
    position: absolute;
    z-index: 2;
    width: 43cqw;
    left: 50%;
    top: 15.5cqw;
    transform: translateX(-50%);
}

/* 현황창 */
.screen {
    width: 100%;
    height: 7.2cqw;
    background: #fff7f9;
    border-radius: 2.5cqw;
    padding: 0.6cqw 1.4cqw;
    margin-bottom: 1.2cqw;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* 계산 과정: Buffy Light */
#history {
    width: 100%;
    height: 2cqw;
    font-family: 'Buffy', sans-serif;
    font-weight: normal;
    font-size: 1.5cqw;
    color: #a66bb5;
    text-align: right;
    overflow: hidden;
    white-space: nowrap;
}

/* 결과 숫자: Buffy Light */
#display {
    width: 100%;
    height: 3.8cqw;
    border: none;
    outline: none;
    background: transparent;
    color: #a45cba;
    font-family: 'Buffy', sans-serif;
    font-weight: normal;
    font-size: 2.7cqw;
    text-align: right;
    padding: 0;
}

/* 버튼 4열 */
.buttons {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 7.7cqw;
    gap: 0.9cqw;
}

/* 버튼 디자인: 기존 폰트 유지 */
button {
    min-width: 0;
    border: none;
    border-radius: 2.3cqw;
    background: #c87bd5;
    color: white;
    font-family: 'Hearty Beltime', cursive;
    font-size: 2.9cqw;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
}

button:hover {
    background: #b86ac9;
}

button:active {
    transform: scale(0.95);
}

/* C, = 버튼은 두 칸 */
.wide {
    grid-column: span 2;
}

@media (max-width: 500px) {
    .wrapper {
        padding-top: 12px;
    }

    h1 {
        margin-bottom: 8px;
    }
}
</style>
</head>

<body>

<div class="wrapper">

    <h1>❣ HEART CALCULATOR ❣</h1>

    <div class="stage">

        <!-- 하트 배경 -->
        <svg class="heart"
             viewBox="0 0 750 650"
             preserveAspectRatio="xMidYMid meet"
             xmlns="http://www.w3.org/2000/svg">

            <path
                d="
                M 375 625
                C 345 595, 120 395, 55 290
                C -10 180, 60 35, 195 30
                C 270 25, 335 60, 375 100
                C 415 60, 480 25, 555 30
                C 690 35, 760 180, 695 290
                C 630 395, 405 595, 375 625
                Z"
                fill="#fdbfea">
            </path>
        </svg>

        <!-- 계산기 -->
        <form class="calculator" onsubmit="return false;">

            <div class="screen">
                <div id="history"></div>
                <input type="text"
                       id="display"
                       value="0"
                       readonly>
            </div>

            <div class="buttons">

                <button type="button" class="wide"
                        onclick="clearAll()">C</button>
                <button type="button"
                        onclick="percent()">%</button>
                <button type="button"
                        onclick="setOperator('/')">/</button>

                <button type="button"
                        onclick="inputNumber('7')">7</button>
                <button type="button"
                        onclick="inputNumber('8')">8</button>
                <button type="button"
                        onclick="inputNumber('9')">9</button>
                <button type="button"
                        onclick="setOperator('*')">*</button>

                <button type="button"
                        onclick="inputNumber('4')">4</button>
                <button type="button"
                        onclick="inputNumber('5')">5</button>
                <button type="button"
                        onclick="inputNumber('6')">6</button>
                <button type="button"
                        onclick="setOperator('+')">+</button>

                <button type="button"
                        onclick="inputNumber('1')">1</button>
                <button type="button"
                        onclick="inputNumber('2')">2</button>
                <button type="button"
                        onclick="inputNumber('3')">3</button>
                <button type="button"
                        onclick="setOperator('-')">-</button>

                <button type="button"
                        onclick="inputNumber('0')">0</button>
                <button type="button"
                        onclick="inputDecimal()">.</button>
                <button type="button" class="wide"
                        onclick="calculate()">=</button>

            </div>
        </form>

    </div>
</div>

<script>
let firstNumber = null;
let operator = null;
let newNumber = false;

const display = document.getElementById('display');
const history = document.getElementById('history');

// 숫자 입력
function inputNumber(num) {
    if (display.value === 'Error') {
        clearAll();
    }

    if (newNumber) {
        display.value = num;
        newNumber = false;

        if (operator === null) {
            history.textContent = '';
        }
    }
    else if (display.value === '0') {
        display.value = num;
    }
    else {
        display.value += num;
    }
}

// 소수점 입력
function inputDecimal() {
    if (display.value === 'Error') {
        clearAll();
    }

    if (newNumber) {
        display.value = '0.';
        newNumber = false;

        if (operator === null) {
            history.textContent = '';
        }
    }
    else if (!display.value.includes('.')) {
        display.value += '.';
    }
}

// 연산자 입력
function setOperator(op) {
    if (display.value === 'Error') return;

    if (operator !== null && !newNumber) {
        calculate();

        if (display.value === 'Error') return;
    }

    firstNumber = Number(display.value);
    operator = op;
    newNumber = true;

    history.textContent =
        firstNumber + ' ' + op;
}

// 계산하기
function calculate() {
    if (operator === null || newNumber) return;

    let secondNumber = Number(display.value);
    let result;

    if (operator === '+') {
        result = firstNumber + secondNumber;
    }
    else if (operator === '-') {
        result = firstNumber - secondNumber;
    }
    else if (operator === '*') {
        result = firstNumber * secondNumber;
    }
    else if (operator === '/') {
        if (secondNumber === 0) {
            history.textContent =
                firstNumber + ' / ' + secondNumber + ' =';
            display.value = 'Error';

            firstNumber = null;
            operator = null;
            newNumber = true;
            return;
        }

        result = firstNumber / secondNumber;
    }

    history.textContent =
        firstNumber + ' ' +
        operator + ' ' +
        secondNumber + ' =';

    display.value = String(
        Number(result.toPrecision(12))
    );

    firstNumber = null;
    operator = null;
    newNumber = true;
}

// C 초기화
function clearAll() {
    display.value = '0';
    history.textContent = '';
    firstNumber = null;
    operator = null;
    newNumber = false;
}

// 퍼센트
function percent() {
    if (display.value === 'Error') return;

    display.value = String(
        Number(display.value) / 100
    );
}

// 키보드 입력
document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') {
        inputNumber(e.key);
    }
    else if (e.key === '.') {
        inputDecimal();
    }
    else if (['+', '-', '*', '/'].includes(e.key)) {
        e.preventDefault();
        setOperator(e.key);
    }
    else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate();
    }
    else if (e.key === 'Escape') {
        clearAll();
    }
});
</script>

</body>
</html>

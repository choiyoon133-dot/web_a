<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단 과제</title>
</head>
<body>
    <h1>구구단</h1>
    <h3>최윤정 2024101476</h3>
    <hr>
    <script>
        for (let dan = 2; dan <= 9; dan++) {
            document.write('<h2>'+ dan + '단<h2>');
                
            for (let i = 1; i <= 9; i++) {
                document.write(dan + 'x' + i + '=' + dan * i + '<br>');

            }
        }
    </script>
</body>
</html>
